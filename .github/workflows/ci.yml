name: OwnStack checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OWNSTACK_AI_MODE: 'off'
  OWNSTACK_MAX_LIVE_CALLS: '0'
  NEBIUS_API_KEY: ''
  NEBIUS_MODEL_ID: ''
  NEBIUS_PATCH_MODEL_ID: ''

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: pytest --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
