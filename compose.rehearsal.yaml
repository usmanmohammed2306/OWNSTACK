# Private AI-off rehearsal against a new restored database on a dedicated local network.
# Create a unique network and attach only the fixture database, not the old app.
# Use a new project name and --no-deps: never start this file's inherited db service.
services:
  migrate:
    environment: &offline
      OWNSTACK_DATABASE_URL: ${OWNSTACK_REHEARSAL_DATABASE_URL:?Explicit restored local database required}
      OWNSTACK_DB_IO_TIMEOUT_SECONDS: ${OWNSTACK_DB_IO_TIMEOUT_SECONDS:-15}
      OWNSTACK_AI_MODE: "off"
      OWNSTACK_MAX_LIVE_CALLS: "0"
      OWNSTACK_ENV: "local"
      OWNSTACK_SIGNING_SECRET: local-demo-secret-not-for-deployment
      OWNSTACK_DEMO_PASSWORD: demo-only-pass
      OWNSTACK_PUBLIC_ORIGIN: http://127.0.0.1:${OWNSTACK_WEB_PORT:?Explicit unused loopback port required}
      NEBIUS_API_KEY: ""
      NEBIUS_MODEL_ID: ""
      NEBIUS_PATCH_MODEL_ID: ""
  api:
    environment:
      <<: *offline
      OWNSTACK_DATABASE_URL: ${OWNSTACK_REHEARSAL_RUNTIME_DATABASE_URL:-${OWNSTACK_REHEARSAL_DATABASE_URL:?Explicit restored database required}}
      OWNSTACK_ENFORCE_DB_ROLE: ${OWNSTACK_ENFORCE_DB_ROLE:-false}
  worker:
    environment:
      <<: *offline
      OWNSTACK_DATABASE_URL: ${OWNSTACK_REHEARSAL_RUNTIME_DATABASE_URL:-${OWNSTACK_REHEARSAL_DATABASE_URL:?Explicit restored database required}}
      OWNSTACK_ENFORCE_DB_ROLE: ${OWNSTACK_ENFORCE_DB_ROLE:-false}
networks:
  default:
    external: true
    name: ${OWNSTACK_REHEARSAL_NETWORK:?Explicit existing local Docker network required}
