[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ownstack"
version = "0.1.0"
description = "Evidence-first customer-specific software change control"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "alembic>=1.14,<2",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.2.16,<1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
