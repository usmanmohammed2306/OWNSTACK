name: OwnStack checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: pytest --tb=short
      - run: python -m ownstack.evaluate
      - run: python scripts/run_change_benchmark.py --output-dir artifacts/safe-change
      - run: python scripts/run_compatibility_lab.py --output artifacts/compatibility
      - run: python scripts/run_graph_lab.py --repeats 1 --output artifacts/graph
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-orchestration-experiment
          path: artifacts/graph/*.json
          if-no-files-found: warn
      - run: python scripts/submission_preflight.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: docker compose -f compose.full.yaml up -d --build
      - name: Wait for migrations and background health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/smoke_full_stack.py
      - run: python scripts/drill_concurrency.py
      - name: Offline verifier and bounded repair experiments
        run: |
          docker pull python:3.12-slim
          python scripts/run_verifier_lab.py --output artifacts/verifier/report.json
          python scripts/run_verifier_lab.py --backend sidecar --output artifacts/verifier-sidecar/report.json
          python scripts/run_repair_lab.py --output artifacts/repair
      - name: Zero-inference real-process reliability lab
        run: |
          mkdir -p artifacts/reliability
          docker compose -f compose.full.yaml run --rm --no-deps -T \
            --user "$(id -u):$(id -g)" \
            -e OWNSTACK_AI_MODE=off -e OWNSTACK_MAX_LIVE_CALLS=0 \
            -e NEBIUS_API_KEY= -e NEBIUS_MODEL_ID= -e NEBIUS_PATCH_MODEL_ID= \
            -e PYTHONPATH=/lab/src:/lab \
            -e OWNSTACK_LAB_DATABASE_URL=postgresql+psycopg://ownstack:ownstack@db:5432/ownstack \
            -v "$GITHUB_WORKSPACE/src:/lab/src:ro" \
            -v "$GITHUB_WORKSPACE/ops:/lab/ops:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/lab/scripts:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/reliability:/results" \
            api python /lab/scripts/run_reliability_lab.py --repeats 1 --output /results/run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-traces
          path: artifacts/reliability/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-change-experiments
          path: |
            artifacts/verifier/*.json
            artifacts/verifier-sidecar/*.json
            artifacts/repair/*.json
          if-no-files-found: warn
      - if: failure()
        run: docker compose -f compose.full.yaml logs --tail 80
      - if: always()
        run: docker compose -f compose.full.yaml down
