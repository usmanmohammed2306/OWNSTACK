services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ownstack
      POSTGRES_PASSWORD: ownstack
      POSTGRES_DB: ownstack
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownstack"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - ownstack_pg:/var/lib/postgresql/data
volumes:
  ownstack_pg:
