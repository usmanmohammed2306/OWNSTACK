limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
map $request_method $ownstack_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $ownstack_login_key zone=login_limit:10m rate=6r/m;

# Only successful, fingerprinted public build assets may be cached by an edge.
# Authenticated API responses, HTML, errors and unknown paths remain no-store.
map "$status:$uri" $ownstack_cache_control {
    default "no-store";
    "~^(200|304):/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2|svg|png|webp)$" "public, max-age=31536000, immutable";
}

# Keep the original socket peer even after real-ip rewriting. Only the pinned
# TLS edge may assert HTTPS; an internal/direct client cannot spoof the scheme.
map "$realip_remote_addr:$http_x_forwarded_proto" $ownstack_forwarded_scheme {
    default $scheme;
    "${OWNSTACK_EDGE_INTERNAL_IP}:https" https;
}

server {
    listen 8080;
    server_name _;
    set_real_ip_from ${OWNSTACK_EDGE_INTERNAL_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8800;
    client_max_body_size 64k;
    limit_req_status 429;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $ownstack_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /v1/session {
        limit_except GET POST { deny all; }
        limit_req zone=login_limit burst=10 nodelay;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ownstack_forwarded_scheme;
        proxy_set_header Forwarded "";
    }

    location /v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_read_timeout 75s;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ownstack_forwarded_scheme;
        proxy_set_header Forwarded "";
    }
    location /health/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ownstack_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
    }
}
