# Use with compose.full.yaml after setting an owned domain and production secrets.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${OWNSTACK_DB_PASSWORD:?Set a strong database password}
    restart: unless-stopped

  migrate:
    environment:
      OWNSTACK_DATABASE_URL: postgresql+psycopg://ownstack:${OWNSTACK_DB_PASSWORD}@db:5432/ownstack
      OWNSTACK_TRUSTED_PROXY_IPS: ${OWNSTACK_WEB_INTERNAL_IP:?Pin the trusted web proxy IP}

  api:
    command: ["python", "-m", "uvicorn", "ownstack.api:app", "--host", "0.0.0.0", "--port", "8800", "--proxy-headers", "--forwarded-allow-ips", "${OWNSTACK_WEB_INTERNAL_IP:?Pin the trusted web proxy IP}", "--limit-concurrency", "100", "--ws", "none"]
    environment:
      OWNSTACK_DATABASE_URL: postgresql+psycopg://${OWNSTACK_RUNTIME_DB_USER:-ownstack_app}:${OWNSTACK_RUNTIME_DB_PASSWORD:?Provision a least-privileged runtime role}@db:5432/ownstack
      OWNSTACK_TRUSTED_PROXY_IPS: ${OWNSTACK_WEB_INTERNAL_IP:?Pin the trusted web proxy IP}

  worker:
    environment:
      OWNSTACK_DATABASE_URL: postgresql+psycopg://${OWNSTACK_RUNTIME_DB_USER:-ownstack_app}:${OWNSTACK_RUNTIME_DB_PASSWORD:?Provision a least-privileged runtime role}@db:5432/ownstack
      OWNSTACK_TRUSTED_PROXY_IPS: ${OWNSTACK_WEB_INTERNAL_IP:?Pin the trusted web proxy IP}

  web:
    ports: !reset []
    environment:
      OWNSTACK_EDGE_INTERNAL_IP: ${OWNSTACK_EDGE_INTERNAL_IP:?Pin the trusted TLS edge IP}
    networks:
      default:
        ipv4_address: ${OWNSTACK_WEB_INTERNAL_IP:?Pin the trusted web proxy IP}

  edge:
    image: caddy:2-alpine
    environment:
      OWNSTACK_DOMAIN: ${OWNSTACK_DOMAIN:?Set your owned public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${OWNSTACK_EDGE_INTERNAL_IP:?Pin the trusted TLS edge IP}

networks:
  default:
    ipam:
      config:
        - subnet: ${OWNSTACK_SERVICE_SUBNET:?Choose an unused private service subnet}

volumes:
  caddy_data:
  caddy_config:
